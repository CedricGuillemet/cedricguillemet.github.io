<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Babylon Viewer Test</title>

<script type="module" src="https://cdn.jsdelivr.net/npm/@babylonjs/viewer/dist/babylon-viewer.esm.min.js"></script>

<style>
html, body {
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

babylon-viewer {
    width:100%;
    height:100%;
    display:block;
}
</style>
</head>

<body>

<babylon-viewer
  source="https://raw.githubusercontent.com/CedricGuillemet/dump/master/demo90/arcane/arcane-noground.glb"
  environment="https://assets.babylonjs.com/ibl/Runyon_Canyon_A_2k_cube_specular.env"
  ssao="enabled"
  camera-orbit="1.384 1.313 19.128"
  camera-target="-0.000 5.952 0.040">
</babylon-viewer>

</body>
</html>
